<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KinBubble — Family Tree Creator</title>
<meta name="description" content="Build, explore and share your family tree as interactive bubbles.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='22' cy='24' r='14' fill='%2314b8a6'/%3E%3Ccircle cx='42' cy='38' r='16' fill='%23f59e0b' fill-opacity='.9'/%3E%3Ccircle cx='20' cy='46' r='9' fill='%236366f1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <a class="brand" href="/" data-link>
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><circle cx="22" cy="24" r="14" fill="#14b8a6"/><circle cx="42" cy="38" r="16" fill="#f59e0b" fill-opacity=".9"/><circle cx="20" cy="46" r="9" fill="#6366f1"/></svg>
      <span>KinBubble</span>
    </a>
    <div id="tree-title" class="tree-title" hidden></div>
    <div class="search-wrap" id="search-wrap" hidden>
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search people, family name, place, job…" autocomplete="off">
      <select id="search-field" title="Search in">
        <option value="any">Everything</option>
        <option value="name">Name</option>
        <option value="family">Family name</option>
        <option value="details">Details</option>
      </select>
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="topbar-right">
      <button id="btn-share" class="btn ghost" hidden>Share</button>
      <div id="user-menu" class="user-menu" hidden>
        <button id="user-btn" class="avatar-btn" title="Account"></button>
        <div class="menu" id="user-dropdown" hidden>
          <div class="menu-head"><strong id="menu-name"></strong><small id="menu-email"></small></div>
          <a href="/" data-link class="menu-item">My trees</a>
          <button class="menu-item" id="btn-account">Account settings</button>
          <button class="menu-item danger" id="btn-logout">Log out</button>
        </div>
      </div>
      <button id="btn-login-top" class="btn primary" hidden>Log in</button>
    </div>
  </header>

  <main id="view"></main>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>
</div>

<!-- Templates -->
<template id="tpl-auth">
  <section class="auth-screen">
    <div class="auth-hero">
      <div class="hero-bubbles" aria-hidden="true">
        <span style="--s:120px;--x:8%;--y:20%;--c:#14b8a6"></span>
        <span style="--s:80px;--x:30%;--y:60%;--c:#f59e0b"></span>
        <span style="--s:160px;--x:60%;--y:15%;--c:#6366f1"></span>
        <span style="--s:70px;--x:80%;--y:65%;--c:#ec4899"></span>
        <span style="--s:100px;--x:45%;--y:80%;--c:#22c55e"></span>
      </div>
      <h1>Your family, as living bubbles.</h1>
      <p>Add people, connect parents, partners and children, and watch families cluster together. Search anyone by name, family or details. Share a link with relatives so they can explore or help you fill it in.</p>
    </div>
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="register">Create account</button>
      </div>
      <form id="form-login" class="auth-form">
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary block" type="submit">Log in</button>
      </form>
      <form id="form-register" class="auth-form" hidden>
        <label>Your name<input name="name" type="text" required autocomplete="name" maxlength="80"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Password <small>(8+ characters)</small><input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn primary block" type="submit">Create account</button>
      </form>
      <p class="auth-error" id="auth-error" hidden></p>
    </div>
  </section>
</template>

<template id="tpl-dashboard">
  <section class="dashboard">
    <div class="dash-head">
      <div>
        <h1>My trees</h1>
        <p class="muted">Trees you own and trees shared with you.</p>
      </div>
      <button class="btn primary" id="btn-new-tree">+ New tree</button>
    </div>
    <div id="tree-list" class="tree-grid"></div>
  </section>
</template>

<template id="tpl-tree">
  <section class="tree-view">
    <div class="canvas-wrap">
      <svg id="canvas" role="img" aria-label="Family tree graph"></svg>
      <div class="canvas-tools">
        <div class="seg" role="group" aria-label="Layout">
          <button data-layout="bubble" class="active" title="Families cluster as bubbles">Bubbles</button>
          <button data-layout="generations" title="Rows by generation">Generations</button>
        </div>
        <button id="btn-fit" class="tool" title="Fit to screen">⤢</button>
        <button id="btn-add-person" class="btn primary" hidden>+ Add person</button>
      </div>
      <div class="legend" id="legend"></div>
      <div id="empty-state" class="empty-state" hidden>
        <h2>This tree is empty</h2>
        <p>Add the first person — yourself, a parent or a grandparent — then add relatives from their card.</p>
        <button class="btn primary" id="btn-add-first">+ Add the first person</button>
      </div>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>
    <aside id="side" class="side" hidden></aside>
  </section>
</template>

<script src="/vendor/d3.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
